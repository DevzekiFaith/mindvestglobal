<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A84C" />
      <stop offset="30%" stop-color="#E8C97A" />
      <stop offset="50%" stop-color="#FDF3CF" />
      <stop offset="70%" stop-color="#E8C97A" />
      <stop offset="100%" stop-color="#C9A84C" />
    </linearGradient>
  </defs>

  <!-- Transparent / Dark background support -->
  <rect width="600" height="400" fill="transparent" />

  <!-- The Three Concentric Arches + Inner Pillar (i) -->
  <g transform="translate(170, 20) scale(0.52)">
    <!-- Outer Arch -->
    <path d="M 61 441 L 61 256 A 195 195 0 0 1 451 256 L 451 441 L 421 441 L 421 256 A 165 165 0 0 0 91 256 L 91 441 Z" fill="url(#gold-grad)" />
    
    <!-- Middle Arch -->
    <path d="M 121 441 L 121 256 A 135 135 0 0 1 391 256 L 391 441 L 361 441 L 361 256 A 105 105 0 0 0 151 256 L 151 441 Z" fill="url(#gold-grad)" />
    
    <!-- Inner Arch -->
    <path d="M 181 441 L 181 256 A 75 75 0 0 1 331 256 L 331 441 L 301 441 L 301 256 A 45 45 0 0 0 211 256 L 211 441 Z" fill="url(#gold-grad)" />
    
    <!-- Inner Column (i) -->
    <path d="M 241 441 L 241 311 L 256 291 L 271 311 L 271 441 Z" fill="url(#gold-grad)" />
    
    <!-- Dot of the i -->
    <circle cx="256" cy="256" r="15" fill="url(#gold-grad)" />
    
    <!-- Base Pedestal -->
    <path d="M 30 447 L 52 441 L 460 441 L 482 447 L 476 451 L 36 451 Z" fill="url(#gold-grad)" />
  </g>

  <!-- Typography: MINDVEST -->
  <text x="300" y="300" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-size="44" font-weight="400" fill="#FFFFFF" letter-spacing="14" text-anchor="middle">
    MINDVEST
  </text>

  <!-- Decorative Divider Lines + GLOBAL -->
  <line x1="160" y1="322" x2="235" y2="322" stroke="url(#gold-grad)" stroke-width="1" />
  <text x="300" y="327" font-family="'DM Mono', 'Courier New', monospace" font-size="16" font-weight="500" fill="url(#gold-grad)" letter-spacing="10" text-anchor="middle">
    GLOBAL
  </text>
  <line x1="365" y1="322" x2="440" y2="322" stroke="url(#gold-grad)" stroke-width="1" />

  <!-- Subtitle Tagline -->
  <text x="300" y="365" font-family="'DM Mono', 'Courier New', monospace" font-size="10.5" font-weight="400" fill="#94A3B8" letter-spacing="4" text-anchor="middle">
    BUILDING THE ARCHITECTURE OF HUMAN POTENTIAL
  </text>
</svg>
